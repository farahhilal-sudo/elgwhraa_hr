  <script>
    // يحدد وضع العرض: تطبيق مثبّت (شكل موبايل بشريط سفلي) أو موقع في المتصفح. للتجربة: ?mode=app أو ?mode=web
    (function () {
      var m = null; try { m = new URLSearchParams(location.search).get('mode'); if (m) sessionStorage.setItem('mode', m); else m = sessionStorage.getItem('mode'); } catch (e) {}
      var st = ['standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'].some(function (d) { return matchMedia('(display-mode: ' + d + ')').matches; }) || navigator.standalone === true;
      if (m === 'app' || (st && m !== 'web')) document.documentElement.classList.add('is-app');
    })();
  </script>
