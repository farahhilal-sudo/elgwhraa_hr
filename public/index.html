<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script>
    // يحدد وضع العرض: تطبيق مثبّت (شكل موبايل بشريط سفلي) أو موقع في المتصفح. للتجربة: ?mode=app أو ?mode=web
    (function () {
      var m = null; try { m = new URLSearchParams(location.search).get('mode'); if (m) sessionStorage.setItem('mode', m); else m = sessionStorage.getItem('mode'); } catch (e) {}
      var st = ['standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'].some(function (d) { return matchMedia('(display-mode: ' + d + ')').matches; }) || navigator.standalone === true;
      if (m === 'app' || (st && m !== 'web')) document.documentElement.classList.add('is-app');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>نظام الحضور والموارد البشرية</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="الحضور">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
