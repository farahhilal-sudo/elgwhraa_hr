  <script>
    // يحدد وضع العرض: تطبيق مثبّت (شكل موبايل بشريط سفلي) أو موقع في المتصفح. للتجربة: ?mode=app أو ?mode=web
    (function () {
      var m = null; try { m = new URLSearchParams(location.search).get('mode'); if (m) sessionStorage.setItem('mode', m); else m = sessionStorage.getItem('mode'); } catch (e) {}
      var st = ['standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'].some(function (d) { return matchMedia('(display-mode: ' + d + ')').matches; }) || navigator.standalone === true;
      if (m === 'app' || (st && m !== 'web')) document.documentElement.classList.add('is-app');
    })();
  </script>

    /* شاشة تحميل مبدئية: بتظهر فوراً (قبل ما ملفات الواجهة تتحمّل) لو فيه جلسة مسجّلة، وبتتشال أول ما التطبيق يرسم */
    html, body { background: #f2f5fa; } body { margin: 0; font-family: Cairo, system-ui, sans-serif; }
    #boot { display: none; } html.has-tk #boot { display: block; }
    #boot .bh { height: 56px; background: #f7d84a; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
    #boot .bl { width: 34px; height: 34px; border-radius: 10px; background: #fff; } #boot .bt { width: 110px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.7); }
    #boot .bb { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
    #boot .bc { height: 92px; border-radius: 14px; background: #fff; border: 1px solid #f1e6b0; position: relative; overflow: hidden; }
    #boot .bc::after, #boot .bl::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(247,216,74,.22), transparent); transform: translateX(100%); animation: bsh 1.2s infinite; }
    #boot .bl { position: relative; overflow: hidden; } @keyframes bsh { to { transform: translateX(-100%); } }
    html.is-app #boot .bb { padding-bottom: 80px; } html.is-app #boot .bn { display: block; } #boot .bn { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; border-top: 1px solid #f1e6b0; }
  </style>
